<div class="card p-3" style="max-width: 420px">
  <h2 class="h6 mb-3">Seguidores por red social</h2>

  <app-backend-loader
    [cargando]="cargando()"
    [error]="error()"
    mensajeCarga="Cargando datos..."
  ></app-backend-loader>

  @if (!cargando() && !error()) {
    <canvas baseChart type="doughnut" [data]="data()"></canvas>
  }
</div>
